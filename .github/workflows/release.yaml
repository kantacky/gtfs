name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  BINARY_NAME: GTFSCLI
  COMMAND_NAME: gtfs

jobs:
  tag:
    name: Create tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Calculate next version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch"
            exit 1
          fi
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          latest="${latest:-0.0.0}"
          IFS=. read -r major minor patch <<< "${latest}"
          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump: ${BUMP}"; exit 1 ;;
          esac
          VERSION="${major}.${minor}.${patch}"
          echo "Latest: ${latest} -> Next: ${VERSION} (${BUMP})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${GITHUB_SHA}"
          echo "Created tag ${VERSION} at ${GITHUB_SHA}"

  build:
    name: Build, notarize and release
    needs: tag
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      asset: ${{ steps.package.outputs.asset }}
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      KEYCHAIN_PATH: ${{ runner.temp }}/release.keychain-db
      KEYCHAIN_PROFILE: notarytool-profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Setup Xcode
        run: |
          xcodes select
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password="$(uuidgen)"
          cert_path="${RUNNER_TEMP}/certificate.p12"
          echo -n "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${keychain_password}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${keychain_password}" "${KEYCHAIN_PATH}"
          security import "${cert_path}" -P "${CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${keychain_password}" "${KEYCHAIN_PATH}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          rm -f "${cert_path}"

      - name: Store notarytool credentials
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ vars.ASC_API_KEY_ISSUER_ID }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${ASC_API_KEY_P8}" > "${key_path}"
          xcrun notarytool store-credentials "${KEYCHAIN_PROFILE}" \
            --key "${key_path}" \
            --key-id "${ASC_API_KEY_ID}" \
            --issuer "${ASC_API_KEY_ISSUER_ID}" \
            --keychain "${KEYCHAIN_PATH}"
          rm -f "${key_path}"

      - name: Build, sign and notarize
        env:
          SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
        run: ./scripts/build-and-notarize-cli.sh

      - name: Package
        id: package
        run: |
          asset="${COMMAND_NAME}-${VERSION}-$(uname -m).tar.gz"
          test -f "dist/${asset}"
          cp "dist/${asset}" "${asset}"
          sha256="$(shasum -a 256 "${asset}" | awk '{print $1}')"
          echo "${sha256}  ${asset}" > "${asset}.sha256"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          file ".build/release/${BINARY_NAME}"
          ".build/release/${BINARY_NAME}" --help

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          gh release create "${VERSION}" \
            "${ASSET}" \
            "${ASSET}.sha256" \
            --title "${VERSION}" \
            --generate-notes \
            --verify-tag

      - name: Clean up keychain
        if: ${{ always() }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" || true
          rm -f "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/certificate.p12"

  update-formula:
    name: Open PR to homebrew-tap
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Get app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Write formula
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p Formula
          cat > Formula/gtfs.rb <<EOF
          class Gtfs < Formula
            desc "Utilities for GTFS and GTFS-JP"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/releases/download/${VERSION}/gtfs-${VERSION}-arm64.tar.gz"
            version "${VERSION}"
            sha256 "${SHA256}"

            depends_on arch: :arm64
            depends_on macos: :tahoe # Package.swift の .macOS(.v26) に合わせる

            def install
              bin.install "GTFSCLI" => "gtfs"
            end

            test do
              assert_match "gtfs", shell_output("#{bin}/gtfs --help")
            end
          end
          EOF
          cat Formula/gtfs.rb

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="gtfs-${VERSION}"
          git config user.name "${{ steps.bot.outputs.name }}"
          git config user.email "${{ steps.bot.outputs.email }}"
          git switch -c "${branch}"
          git add Formula/gtfs.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "gtfs ${VERSION}"
          git push --force origin "${branch}"
          if gh pr view "${branch}" >/dev/null 2>&1; then
            echo "PR already exists"
          else
            gh pr create \
              --title "gtfs ${VERSION}" \
              --body "Update gtfs to [${VERSION}](https://github.com/${{ github.repository }}/releases/tag/${VERSION})." \
              --head "${branch}"
          fi

  cleanup:
    name: Delete release and tag on failure
    needs: [tag, build, update-formula]
    if: ${{ always() && needs.tag.result == 'success' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${VERSION}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            echo "Deleted release ${VERSION}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}"
            echo "Deleted tag ${VERSION}"
          fi
          echo "::warning::Release ${VERSION} did not complete; the release and tag were deleted"
